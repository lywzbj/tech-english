spring:
  application:
    name: tech-english
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  # Default runtime database: SQLite file, no server to install.
  # Switch to MySQL with: --spring.profiles.active=mysql (see application-mysql.yml).
  datasource:
    url: ${DB_URL:jdbc:sqlite:${SQLITE_PATH:./data/tech-english.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # The after-commit indexer opens its own transaction while the request
      # connection is still checked out, so the pool needs a second slot.
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    # Flyway 11 community does not ship a SQLite dialect.
    # SQLite schema is applied by SqliteSchemaMigrator from db/migration/sqlite.
    enabled: false
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:tech-english-local-development-secret-change-me-0123456789abcdef}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  ai:
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:3000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
    # Active prompt version per purpose. Loaded from the classpath at startup
    # (prompts/<purpose>/<version>-system.md and -user.md); missing or blank
    # files fail application startup. See PromptRegistry.
    prompts:
      explain: ${AI_PROMPT_VERSION_EXPLAIN:v2}
      grammar-explain: ${AI_PROMPT_VERSION_GRAMMAR_EXPLAIN:v1}
      writing-review: ${AI_PROMPT_VERSION_WRITING_REVIEW:v1}
      question-gen: ${AI_PROMPT_VERSION_QUESTION_GEN:v2}
      exercise-gen: ${AI_PROMPT_VERSION_EXERCISE_GEN:v2}
      exercise-judge: ${AI_PROMPT_VERSION_EXERCISE_JUDGE:v1}
      ability-assess: ${AI_PROMPT_VERSION_ABILITY_ASSESS:v1}
      preview: ${AI_PROMPT_VERSION_PREVIEW:v1}
      vocab-judge: ${AI_PROMPT_VERSION_VOCAB_JUDGE:v1}
      vocab-scan: ${AI_PROMPT_VERSION_VOCAB_SCAN:v1}
  vector:
    enabled: ${VECTOR_ENABLED:true}
    dimension: ${EMBEDDING_DIMENSION:384}
    provider: ${EMBEDDING_PROVIDER:hash}
    model: ${EMBEDDING_MODEL:local-hash-384}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
    # Extension file without suffix; .dll/.so/.dylib is resolved per platform.
    sqlite-extension: ${SQLITE_VEC_EXTENSION:lib/sqlite-vec/vec0}
    max-results: 20

logging:
  level:
    com.techenglish: INFO
    # AI 调用模块级别。开发默认 TRACE：控制台打印完整 system/user 提示词、模型原始回复
    # （提示词含学习者选中的原文，故只在开发可见）。生产 .env 设 LOG_LEVEL_AI=INFO
    # （只留每次调用摘要）或 WARN（只留降级与失败）。
    com.techenglish.ai: ${LOG_LEVEL_AI:TRACE}
    # DEBUG 时 Spring AI 会把 chat/completions 的完整请求/响应 HTTP 体打出来，
    # 排查协议层问题时临时调 DEBUG。
    org.springframework.ai: ${LOG_LEVEL_SPRING_AI:WARN}
    org.hibernate.SQL: WARN
